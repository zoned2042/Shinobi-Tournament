<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fantasy Shinobi Tournament</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg:#05060a; --panel:#11151d; --panel2:#171d27; --ink:#f0ece2; --muted:#828c9c; --soft:#b0b9c6;
  --flame:#e08a3c; --flame-ink:#06070c; --chakra:#4f97e0; --chakra-ink:#04121f; --ko:#e06a55; --gen:#bd88ec; --good:#6cc47c; --line:#232b38; --ready:#e2b24a;
  --glow:rgba(224,138,60,.20); --edge:rgba(255,255,255,.08); --shadow:rgba(0,0,0,.55);
  --serif:Georgia,'Times New Roman',serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --bg:#ddd2b6; --panel:#f2ecda; --panel2:#e9e0c8; --ink:#161009; --muted:#5f5540; --soft:#33291b;
    --flame:#9a4f12; --flame-ink:#fff8ec; --chakra:#1f4a6d; --chakra-ink:#f6f0e0; --ko:#8a3320; --gen:#553a70; --good:#2f5a2b; --line:#b3a17c; --ready:#6f4a0f;
    --glow:rgba(154,79,18,.10); --edge:rgba(0,0,0,.18); --shadow:rgba(90,70,40,.25);
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#ddd2b6; --panel:#f2ecda; --panel2:#e9e0c8; --ink:#161009; --muted:#5f5540; --soft:#33291b;
  --flame:#9a4f12; --flame-ink:#fff8ec; --chakra:#1f4a6d; --chakra-ink:#f6f0e0; --ko:#8a3320; --gen:#553a70; --good:#2f5a2b; --line:#b3a17c; --ready:#6f4a0f;
  --glow:rgba(154,79,18,.10); --edge:rgba(0,0,0,.18); --shadow:rgba(90,70,40,.25);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:radial-gradient(ellipse 90% 60% at 18% -8%,var(--glow),transparent 62%) fixed,var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Hiragino Sans",sans-serif;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--serif);font-weight:700;margin:0;line-height:1.08;letter-spacing:-.02em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--chakra);outline-offset:2px}
#app{max-width:1180px;margin:0 auto;padding:20px 16px 110px}
h1{font-size:clamp(28px,6vw,48px)}
h2{font-size:clamp(20px,4vw,28px)}
.lede{max-width:64ch;color:var(--muted);margin:10px 0 0}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

.btn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px 16px;font-weight:700;min-height:44px}
.btn:hover:not(:disabled){border-color:var(--flame)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--flame);border-color:var(--flame);color:var(--flame-ink)}
.btn.small{min-height:38px;padding:6px 12px;font-size:14px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px 24px;margin:20px 0 14px}
.sl{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.sh{font-size:12px;color:var(--muted);margin-top:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel2)}
.seg button{border:0;background:transparent;padding:8px 14px;min-height:40px;font-weight:700;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-checked="true"]{background:var(--flame);color:var(--flame-ink)}
.seg button:disabled{opacity:.35;cursor:not-allowed}

.tray{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tray .slots{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:0}
.slot{display:flex;align-items:center;gap:8px;border:2px dashed var(--line);border-radius:999px;padding:3px 12px 3px 3px;min-height:44px;color:var(--muted);background:transparent;font-size:14px}
.slot.filled{border:2px solid var(--flame);color:var(--ink);background:var(--panel);font-weight:700}
.slot .x{color:var(--muted);font-weight:400}
.slot.empty{padding:3px 16px}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}
.toolbar input[type=search]{flex:1;min-width:150px;max-width:260px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:42px}
.toolbar select{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:42px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;max-width:100%}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:700;color:var(--muted);white-space:nowrap;min-height:38px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{font-size:13px;color:var(--muted);margin-left:auto}

.fam{margin:0 0 18px;border:1px solid var(--line);border-radius:16px;padding:12px}
.famh{display:flex;align-items:baseline;gap:6px 12px;flex-wrap:wrap;margin:0 0 10px}
.famh h3{font-size:18px}
.famn{font-size:13px;color:var(--muted)}
.famp{font-size:13px;font-weight:700;color:var(--flame);margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card{text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card:hover{border-color:var(--muted)}
.card.sel{border-color:var(--flame);background:var(--panel2)}
.card.dim:not(.sel){opacity:.55}
.card.locked{opacity:.4;cursor:not-allowed}
.card.locked:hover{border-color:var(--line)}
.lk{flex-basis:100%;font-size:12px;color:var(--flame)}
.ch{display:flex;gap:10px;align-items:center}
.ct{min-width:0;flex:1}
.cname{font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.cform{font-size:12px;color:var(--muted);line-height:1.3}
.tier{font-family:var(--serif);font-weight:700;font-size:15px;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--line)}
.tier.S{background:var(--flame);color:var(--flame-ink)}
.tier.A{background:var(--chakra);color:var(--chakra-ink)}
.tier.B{background:var(--panel2);border:1px solid var(--muted)}
.cs{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px}
.st{display:grid;grid-template-columns:24px 1fr 24px;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.st i{display:block;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.st b{display:block;height:100%;background:var(--flame)}
.st u{text-decoration:none;color:var(--ink);text-align:right}
.cf{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.cf .sig{color:var(--ink);font-weight:700;flex-basis:100%}
.tg{border:1px solid var(--line);border-radius:5px;padding:0 6px;font-size:11px}

.crest{--h:200;--ring:#888;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:14px;color:#fff;background:hsl(var(--h) 42% 30%);border:3px solid var(--ring);flex:none}
.crest{overflow:hidden}
.crest img{width:100%;height:100%;display:block;object-fit:cover}
.crest.sm{width:34px;height:34px;font-size:11px;border-width:2px}
.crest.lg{width:60px;height:60px;font-size:19px}

.startbar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 40%);display:flex;justify-content:center;z-index:6;pointer-events:none}
.startbar .btn{pointer-events:auto;min-width:min(440px,100%)}
details.rules{margin-top:20px;max-width:72ch;color:var(--muted);font-size:14px}
details.rules summary{cursor:pointer;font-weight:700;color:var(--ink)}
details.rules p{margin:8px 0}

.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}
.sc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.sc.out{opacity:.6}
.sc .n{font-weight:700;line-height:1.2}
.sc .s{font-size:12px;color:var(--muted)}
.sc .p{font-family:var(--serif);font-weight:700;font-size:28px;color:var(--flame);line-height:1.1;margin-top:4px}
.sc.total{border-color:var(--flame);background:var(--panel2)}

.champ{background:var(--panel2);border:2px solid var(--flame);border-radius:16px;padding:16px;margin:0 0 14px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.champ .txt{flex:1;min-width:220px}
.champ p{margin:6px 0 12px;color:var(--muted)}

.phase{display:flex;align-items:center;gap:12px;margin:6px 0 10px;flex-wrap:wrap}
.phase .pn{font-weight:700}
.phase .pc{font-size:13px;color:var(--muted)}
.prog{flex:1;min-width:120px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog b{display:block;height:100%;background:var(--flame);transition:width .4s}

.arena{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}
.arena .label{font-size:13px;color:var(--muted);margin-bottom:10px;display:flex;gap:10px;flex-wrap:wrap}
.arena .label .up{color:var(--flame);font-weight:700}
.hud{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center;margin-bottom:10px}
.hf{min-width:0;display:flex;flex-direction:column;gap:4px;border-radius:10px;transition:opacity .3s}
.hf.r{align-items:flex-end;text-align:right}
.hf .who{display:flex;gap:10px;align-items:center;min-width:0}
.hf.r .who{flex-direction:row-reverse}
.hf .nm{font-weight:700;line-height:1.2;overflow-wrap:break-word}
.hf .who>div{min-width:0}
.hf .fm{font-size:12px;color:var(--muted);line-height:1.3}
.hf .mine{font-size:11px;color:var(--flame);font-weight:700}
.hf.lost{opacity:.55}
.hf.won .nm{color:var(--good)}
.hp{width:100%;height:16px;border-radius:8px;background:var(--line);overflow:hidden}
.hp b{display:block;height:100%;width:100%;background:var(--good);transition:width .35s ease,background-color .35s}
.hp.r b{margin-left:auto}
.hpn{font-size:12px;color:var(--muted)}
.cbar{width:100%;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.cbar b{display:block;height:100%;width:100%;background:var(--chakra);transition:width .35s ease}
.cbar.r b{margin-left:auto}
.ubar{width:100%;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.ubar b{display:block;height:100%;width:0;background:linear-gradient(90deg,#f2a33a,#ffd84d);transition:width .35s ease}
.ubar.r b{margin-left:auto}
.ubar.ready{box-shadow:0 0 10px #ffd84d}
.ulbl{font-size:11px;color:var(--muted);font-weight:700}
.ulbl.ready{color:var(--ready)}
.glbl{font-size:11px;color:var(--muted);font-weight:700}
.glbl.open{color:#5fc46e}
.glbl.death{color:#ff5a3a}
.cf .ultn{flex-basis:100%;color:var(--flame);font-size:11px}
.ft.ult{border-color:var(--ready);color:var(--ready)}
.ft.ult.sup{border-color:#ff4fd8;color:#d03aa8}
.hudmid{text-align:center;font-family:var(--serif);font-weight:700;color:var(--muted);font-size:18px;line-height:1.2}
.hudmid small{display:block;font-family:ui-sans-serif,system-ui,sans-serif;font-weight:400;font-size:11px}
.stagewrap{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#000;aspect-ratio:16/9}
.stagewrap canvas{display:block;width:100%;height:100%}
.ticker{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:28px 14px 10px;background:linear-gradient(transparent,rgba(5,10,16,.88) 55%);opacity:0;transition:opacity .25s;pointer-events:none}
.ticker.on{opacity:1}
.ticker .live{background:#e5384a;color:#fff;font-weight:800;font-size:11px;padding:2px 7px;border-radius:5px;flex:none}
.ticker .tt{color:#fff;font-weight:700;font-size:clamp(13px,2.4vw,18px);text-shadow:0 1px 3px rgba(0,0,0,.85);line-height:1.25}
.ticker .tt.hot{color:#ffd84d}
.ticker .tt.pop{animation:tick .28s ease-out}
@keyframes tick{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.log{list-style:none;margin:12px 0 0;padding:8px 12px;background:var(--bg);border-radius:10px;max-height:150px;overflow-y:auto;font-size:13px;min-height:44px}
.log li{padding:2px 0 2px 10px;border-left:3px solid var(--line);margin:3px 0}
.log li.tai{border-color:var(--flame)}
.log li.nin{border-color:var(--chakra)}
.log li.gen{border-color:var(--gen)}
.log li.sig{border-color:var(--ko);font-weight:700}
.log li.ult{border-color:var(--ready);font-weight:800;color:var(--ready)}
.log li.heal{border-color:var(--good);color:var(--good)}
.log li.end{border-color:var(--good);font-weight:700}
.log li.info{color:var(--muted)}
#controls{margin:14px 0 0}
#controls .hint{font-size:13px;color:var(--muted);margin-top:8px}

.tabs{display:flex;gap:6px;overflow-x:auto;margin:26px 0 10px;padding-bottom:2px}
.tab{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;font-weight:700;white-space:nowrap;min-height:42px;color:var(--muted)}
.tab small{font-weight:400;margin-left:6px;font-size:12px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab:disabled{opacity:.35;cursor:not-allowed}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:10px}
.mc{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.mc:disabled{cursor:default}
.mc.done:hover{border-color:var(--chakra)}
.mc.now{border-color:var(--flame);box-shadow:0 0 0 1px var(--flame)}
.mr{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:7px;color:var(--muted);min-width:0}
.mr.w{color:var(--ink);font-weight:700;background:var(--panel2)}
.mr.l{text-decoration:line-through;text-decoration-color:var(--line)}
.mr.mine{box-shadow:inset 3px 0 0 var(--flame)}
.mr .dot{width:8px;height:8px;border-radius:50%;flex:none}
.mr .mn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.mr .mo{font-size:12px}
.mf{display:flex;gap:5px;flex-wrap:wrap;padding:2px 8px 2px;min-height:22px;font-size:11px;color:var(--muted)}
.ft{border-radius:5px;padding:0 6px;border:1px solid var(--line)}
.ft.ko{border-color:var(--ko);color:var(--ko)}
.ft.up{border-color:var(--gen);color:var(--gen)}
.ft.pts{border-color:var(--flame);color:var(--flame)}

/* tournament types, squad identity, story, history */
.modes{margin:20px 0 0}
.modes + .settings{margin-top:12px}
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.chip[aria-checked="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.md{margin:10px 0 0;font-size:14px;color:var(--muted);max-width:80ch}
.md b{color:var(--ink)}
.era{margin-top:12px}
.hbtn{justify-content:flex-end}
.ident{display:flex;gap:14px;align-items:center;margin:12px 0 0}
.ident:empty{display:none}
.emb{width:64px;height:64px;flex:none;display:block}
.idt{flex:1;min-width:0}
.sqname{width:100%;max-width:440px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-family:var(--serif);font-weight:700;font-size:18px;min-height:42px;text-transform:uppercase;letter-spacing:.02em}
.idm{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:6px;font-size:13px;color:var(--muted);align-items:center}
.idm b{color:var(--ink)}
.idm select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 6px;min-height:38px;margin-left:4px;color:var(--ink)}
.capt{display:inline-block;background:var(--flame);color:var(--flame-ink);border-radius:4px;font-size:10px;line-height:15px;padding:0 4px;margin-left:5px;vertical-align:2px;font-weight:800}
.sbrow{display:flex;gap:10px;width:min(560px,100%);pointer-events:auto}
.startbar .sbrow .btn{min-width:0}
.sbrow .btn.primary{flex:1}
.btn.spect{background:var(--panel);border-color:var(--chakra);color:var(--ink)}
.rep{flex-basis:100%;color:var(--chakra);font-weight:700}
.mtag{font-size:13px;color:var(--muted);font-weight:700;margin-top:3px}
.squadbar{display:flex;gap:12px;align-items:center;margin:14px 0 0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.squadbar .emb{width:54px;height:54px}
.squadbar .sbt{min-width:0}
.squadbar .sn{font-family:var(--serif);font-weight:700;font-size:clamp(17px,3.4vw,22px);text-transform:uppercase;line-height:1.15;overflow-wrap:anywhere}
.squadbar .sm{font-size:13px;color:var(--muted)}
.squadbar .sm b{color:var(--ink)}
.squadbar.spec{border-color:var(--chakra)}
.squadbar.spec .sn{color:var(--chakra)}
.facts{font-size:13px}
.k-upset{--kc:var(--gen)} .k-squad{--kc:var(--flame)} .k-round{--kc:var(--chakra)} .k-champ{--kc:var(--ready)} .k-streak{--kc:var(--ko)} .k-war{--kc:var(--ko)} .k-ko{--kc:var(--good)}
.headline{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-left:5px solid var(--kc);border-radius:12px;padding:10px 14px;margin:0 0 10px;animation:tick .35s ease-out;min-height:44px}
.headline:hover{border-color:var(--kc)}
.headline .ht,.rnote .ht{font-family:var(--serif);font-weight:700;text-transform:uppercase;font-size:15px;color:var(--kc);letter-spacing:.02em}
.headline .hx{flex:1;min-width:min(220px,100%)}
.headline .hm{font-size:12px;color:var(--muted)}
#rhead{display:flex;flex-direction:column;gap:6px;margin:0 0 10px}
#rhead:empty{display:none}
.rnote{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--kc);border-radius:10px;padding:8px 12px;font-size:14px}
.rnote .ht{font-size:13px;margin-right:6px}
.ribs{display:flex;flex-wrap:wrap;gap:4px;padding:2px 4px 4px}
.rib{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--kc);border:1px solid var(--kc);border-radius:5px;padding:0 5px;line-height:17px}
.mc.sq{border-color:var(--flame)}
.mr .gone{font-size:10px;font-weight:800;text-transform:uppercase;color:var(--ko);text-decoration:none;flex:none}
.storyw{display:block}
.story{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;max-width:760px}
.story li{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--kc);border-radius:10px;padding:8px 12px}
.story .sr{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.story .stt{font-family:var(--serif);font-weight:700;text-transform:uppercase;color:var(--kc);font-size:15px;line-height:1.3}
.hf .rec{font-size:11px;color:var(--chakra);font-weight:700}
.hseg{margin:4px 0 14px}
.hcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:10px}
.hcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.hcard .hh{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.hcard .hc{display:flex;gap:10px;align-items:center}
.hcard .hk{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ready);font-weight:800}
.hcard .hn{font-weight:700;font-size:18px;line-height:1.2}
.hcard dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:13px}
.hcard dt{color:var(--muted)}
.hcard dd{margin:0;min-width:0;overflow-wrap:anywhere}
.hstory{margin:0;padding:8px 0 0;border-top:1px solid var(--line);list-style:none;font-size:13px;display:flex;flex-direction:column;gap:3px;color:var(--muted)}
.hstory b{color:var(--ink)}
.sc .p .crest{margin-top:2px}
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.htab{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}
.htab th,.htab td{padding:6px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
.htab th:first-child,.htab td:first-child{text-align:left}
.htab th{font-size:12px;color:var(--muted);font-weight:700;position:sticky;top:0;background:var(--panel)}
.htab tr:last-child td{border-bottom:0}
.htab .fn{display:flex;gap:8px;align-items:center}
.hrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
.hrow .sl{margin:0}
.hrow select{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:42px}
.hclear{margin:24px 0 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:14px}

/* spins, rarity, ninja profile */
.hside{display:flex;flex-direction:column;align-items:flex-end;gap:10px;flex:none}
.prof{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:210px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.prof .pr{font-size:14px;white-space:nowrap}
.prof .pr b{color:var(--flame);font-family:var(--serif);font-weight:700;margin-right:4px}
.prof .ps{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.prof .ps b{color:var(--ink);font-size:15px}
.xpb{grid-column:1 / -1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.xpb b{display:block;height:100%;background:linear-gradient(90deg,var(--chakra),var(--good))}
.toast{margin:14px 0 0;background:var(--panel2);border:1px solid var(--good);border-left:5px solid var(--good);border-radius:12px;padding:10px 14px;font-weight:700;animation:tick .35s ease-out}
.rar{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--rc);line-height:1.4}
.reward{color:var(--ink)!important;font-weight:700}
.reward b{color:var(--good)}
.credit{margin:28px 0 0;font-size:12px;color:var(--muted);max-width:72ch}
.spinp{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--panel)}
.spinhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}
.spinhead h3{font-size:20px}
.spins{text-align:center;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px 14px;flex:none}
.spins b{display:block;font-family:var(--serif);font-weight:700;font-size:28px;color:var(--flame);line-height:1.1}
.spins span{font-size:11px;color:var(--muted)}
.spingrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(170px,100%),1fr));gap:10px}
.sslot{--rc:var(--line);display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:14px 10px;border:2px solid var(--rc);border-radius:14px;background:var(--panel2);background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--rc) 22%,transparent),transparent 70%),var(--panel2);min-height:208px;justify-content:center}
.sslot.empty{border-style:dashed;--rc:var(--line);background:var(--panel2)}
.sslot .qm{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:28px;color:var(--muted);border:3px dashed var(--line)}
.sslot .sn2{font-weight:700;line-height:1.2}
.sslot .sm2{font-size:12px;color:var(--muted);line-height:1.3}
.sslot .btn{margin-top:6px}
.sslot.rolling{animation:none}
.sslot.rolling .crest{filter:blur(.6px)}
.sslot.fresh{animation:landed .55s ease-out}
.sslot.fresh.r-S{animation:landed .55s ease-out,mythic 1.6s ease-in-out 3}
.sslot.fresh.r-A{animation:landed .55s ease-out,mythic 1.6s ease-in-out 1}
@keyframes landed{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:none}}
@keyframes mythic{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 22px 2px var(--rc)}}
@media (prefers-reduced-motion: reduce){ .cbtn.grd.hot{animation:none} .sslot.fresh,.sslot.fresh.r-S,.sslot.fresh.r-A,.toast{animation:none} }

/* fight it yourself: the command bar */
.cmd{background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:12px;transition:box-shadow .2s ease,border-color .2s ease}
.cmd.live{border-color:var(--flame);box-shadow:0 0 0 1px var(--flame),0 0 26px rgba(224,138,60,.18)}
.cmdh{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;font-size:13px;color:var(--muted);margin:0 0 10px}
.cmdh b{color:var(--ink)}
.cmdh .you b{color:var(--flame)}
.cmdh .cmds{flex-basis:100%;color:var(--ink);font-weight:700;font-size:14px}
.cmdg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cbtn{--mc:var(--line);position:relative;text-align:left;display:flex;flex-direction:column;gap:2px;padding:10px 12px 10px 40px;min-height:62px;border-radius:12px;border:1px solid var(--edge);border-left:4px solid var(--mc);background:var(--panel2);color:var(--ink);min-width:0}
.cbtn b{font-size:14px;line-height:1.2;overflow-wrap:anywhere}
.cbtn small{font-size:12px;color:var(--muted);line-height:1.25}
.cbtn kbd{position:absolute;left:10px;top:10px;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font:700 12px ui-monospace,monospace;background:var(--bg);border:1px solid var(--edge);color:var(--muted)}
.cbtn:hover:not(:disabled){border-color:var(--mc);transform:translateY(-2px)}
.cbtn:disabled{opacity:.42;cursor:not-allowed}
.cbtn.tai{--mc:var(--flame)} .cbtn.gate{--mc:#5fc46e} .cbtn.nin{--mc:var(--chakra)} .cbtn.gen{--mc:var(--gen)} .cbtn.sig{--mc:var(--ko)} .cbtn.foc{--mc:var(--good)}
.cbtn.ult{--mc:var(--ready)}
.cbtn.grd{--mc:#7fb8ff}
.cbtn.grd.hot:not(:disabled){box-shadow:0 0 0 2px #7fb8ff,0 0 18px rgba(127,184,255,.45);animation:pulse 1.2s ease-in-out infinite}
.cbtn.sup:not(:disabled){background:linear-gradient(135deg,rgba(226,178,74,.28),rgba(255,79,216,.16) 60%,var(--panel2));box-shadow:0 0 22px rgba(255,79,216,.3)}
.cbtn.sup:not(:disabled) b{color:#ff8ae6}
.threat{margin-top:8px;padding:8px 12px;border-radius:10px;border:1px solid var(--ko);background:rgba(224,106,85,.12);color:var(--ink);font-weight:700;font-size:13px}
@keyframes pulse{50%{box-shadow:0 0 0 2px #7fb8ff,0 0 28px rgba(127,184,255,.7)}}
.ubar.sup b{background:linear-gradient(90deg,#ff4fd8 0 var(--sp),#e2b24a var(--sp) 100%)}
.ubar.sup.ready{box-shadow:0 0 12px #ff4fd8}
.ulbl.sup{color:#c870b0}
.ulbl.sup.ready{color:#ff4fd8}
.cbtn.ult:not(:disabled){background:linear-gradient(135deg,rgba(226,178,74,.22),var(--panel2) 70%);box-shadow:0 0 18px rgba(226,178,74,.25)}
.cbtn.ult:not(:disabled) b{color:var(--ready)}
.cmdr{margin-top:10px}
#cmdslot:not(:empty){margin-top:10px}
.arena.duel .stagewrap{max-width:max(320px,min(100%,calc((100vh - 470px) * 16 / 9)));margin:0 auto}
.arena.duel .hud{max-width:max(320px,min(100%,calc((100vh - 470px) * 16 / 9)));margin-left:auto;margin-right:auto}
.btn.qf{border-color:var(--flame);color:var(--flame)}
.vsp{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;margin:20px 0 14px}
.vsp label{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 200px}
.vsp select{background:var(--panel2);border:1px solid var(--edge);border-radius:10px;padding:9px 10px;min-height:42px;color:var(--ink);max-width:100%}
.vsp .vsx{font-family:var(--serif);font-weight:700;font-size:22px;color:var(--flame);align-self:center}
#controls .reward{margin:0 0 10px}
@media (hover:none){ .cmdh .kh,.cbtn kbd{display:none} .cbtn{padding-left:12px} }

@media (max-width:560px){
  .crest.lg{width:46px;height:46px;font-size:15px}
  .hud{gap:6px}
  .hf .fm{display:none}
  .hf .crest{width:34px;height:34px;border-width:2px}
  .hf .who{gap:6px}
  .hf .nm{font-size:14px}
  .hudmid small{max-width:60px;margin:0 auto;line-height:1.25}
  .tray .slots{flex-wrap:nowrap;overflow-x:auto;flex-basis:100%;scrollbar-width:none;padding-bottom:2px}
  .tray .slots::-webkit-scrollbar{display:none}
  .slot{flex:none}
  .slot.empty{padding:3px 12px}
  .stagewrap{aspect-ratio:auto}
  .stagewrap canvas{height:auto;aspect-ratio:16/9}
  .ticker{position:static;opacity:1;padding:8px 12px;min-height:54px;background:rgba(5,10,16,.94)}
  .ticker .tt{font-size:13px}
  .champ{align-items:flex-start}
  .hdr{flex-wrap:wrap}
  .hside{align-items:stretch;width:100%}
  .prof{min-width:0}
  .spingrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cmd{padding:10px}
  .cmdh{gap:2px 12px;margin-bottom:8px}
  .cmdh .kh{display:none}
  .cmdg{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .cbtn{padding:7px 9px;min-height:50px}
  .cbtn kbd{display:none}
  .cbtn b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cbtn small{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cmdr{gap:6px}
  .cmdr .seg button{padding:6px 10px;min-height:38px}
  .sslot{min-height:0;padding:12px 6px}
  .sslot .sm2{display:none}
  .spinhead h3{font-size:17px}
  .hf .rec{display:none}
  .ident{align-items:flex-start}
  .emb{width:52px;height:52px}
  .squadbar .emb{width:44px;height:44px}
  .sbrow .btn{padding:10px 12px}
}
@media (prefers-reduced-motion: reduce){
  .hp b,.cbar b,.prog b{transition:none}
  .ticker,.ticker .tt.pop{transition:none;animation:none}
  .ubar b{transition:none}
}

/* Shinobi Life look: title block, grain, embers, glass cards */
#app{position:relative;z-index:1}
.sl-grain{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.028) 1px,transparent 1px);background-size:3px 3px;opacity:.6}
.embers{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.embers span{position:absolute;bottom:-12px;border-radius:99px;background:var(--flame);box-shadow:0 0 8px var(--flame);opacity:0;animation:ember linear infinite}
@keyframes ember{0%{transform:translateY(0) translateX(0);opacity:0}12%{opacity:.8}100%{transform:translateY(-88vh) translateX(28px);opacity:0}}
.kicker{display:flex;align-items:center;gap:12px;color:var(--flame);letter-spacing:.42em;font-size:10px;font-weight:700;margin:0 0 12px;text-transform:uppercase}
.kicker::before{content:"";width:26px;height:1px;background:var(--flame);flex:none}
.title{font-family:var(--serif);font-size:clamp(40px,8.6vw,96px);line-height:.88;font-weight:700;letter-spacing:-.03em;text-transform:uppercase;text-shadow:0 0 70px rgba(224,138,60,.33),0 2px 0 rgba(0,0,0,.6);animation:introTitle .95s cubic-bezier(.16,.8,.3,1) both}
.title em{font-style:normal;color:var(--flame)}
.title.small{font-size:clamp(34px,6vw,64px)}
@keyframes introTitle{from{opacity:0;transform:translateY(30px) scale(.97);letter-spacing:.12em}to{opacity:1;transform:none;letter-spacing:-.03em}}
.hdr .lede{font-family:var(--serif);color:var(--soft);font-size:16px;line-height:1.6;margin-top:18px}
.card,.mc,.hcard,.sslot{transition:transform .2s cubic-bezier(.2,.7,.3,1),border-color .2s ease,box-shadow .2s ease}
.card:hover:not(:disabled),.mc.done:hover{transform:translateY(-3px)}
.card.sel{box-shadow:0 10px 28px var(--shadow),0 0 26px rgba(224,138,60,.17)}
.panel,.card,.mc,.sc,.fam,.hcard,.arena,.spinp,.squadbar,.prof,.tab,.chip,.btn{border-color:var(--edge)}
.btn.primary{border-color:var(--flame);box-shadow:0 0 18px rgba(224,138,60,.25)}
.credit a{color:var(--flame);font-weight:700;text-decoration:none;border-bottom:1px solid currentColor}
:root[data-theme="light"] .embers,:root[data-theme="light"] .sl-grain{display:none}
:root[data-theme="light"] .title{text-shadow:none}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .embers,:root:not([data-theme="dark"]) .sl-grain{display:none} :root:not([data-theme="dark"]) .title{text-shadow:none} }
@media (prefers-reduced-motion: reduce){ .embers{display:none} .title{animation:none} .card,.mc,.hcard,.sslot{transition:none} .card:hover:not(:disabled),.mc.done:hover{transform:none} }
@media (max-width:560px){ .kicker{letter-spacing:.26em;font-size:9.5px} .hdr .lede{font-size:15px} }
</style>

/* name-driven look for every ninjutsu projectile */
function jutsuFx(name,base){
  const n=(name||'').toLowerCase().replace(/^an? /,'');
  const has=(...ks)=>ks.some(k=>n.includes(k));
  const mk=(shape,c,c2)=>Object.assign({},base,{shape,c,c2});
  if(has('amaterasu')) return mk('orb','#1a0a12','#ff3a2a');
  if(has('kamui')) return mk('orb','#b36bff','#ffffff');
  if(has('rasen')) return mk('rasen',base.shape==='rasen'?base.c:'#6fd0ff','#ffffff');
  if(has('chidori','lightning','raikiri','thunder','kirin','raijin','panther','laser','black receiver')) return mk('bolt','#9fd0ff','#ffffff');

  const f=t=>{ if(t<0)t+=1; if(t>1)t-=1; return t<1/6?p+(q-p)*6*t:t<1/2?q:t<2/3?p+(q-p)*(2/3-t)*6:p; };

  return '#'+x(f(h+1/3))+x(f(h))+x(f(h-1/3));
}

/* ---------- Stick Nodes figures ----------

   its parent, type (0 root, 1 rounded segment, 2 segment, 3 circle, 4 triangle, 5 filled circle, 6 ellipse, 7 trapezoid),

  {n:'Gate of Life',pw:1.12,sp:6,dr:0,c:'#7fe28a'},
  {n:'Gate of Pain',pw:1.16,sp:8,dr:1,c:'#7fe28a'},
  {n:'Gate of Limit',pw:1.21,sp:10,dr:2,c:'#6ae07a'},

  init(){ if(this.ctx) return; try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} if(this.ctx&&this.ctx.state==='suspended'){ try{ this.ctx.resume(); }catch(e){} } },
  // at: start offset in seconds on the audio clock
  tone(f1,f2,dur,type,vol,at){
    if(!this.on||!this.ctx) return;
    try{
      const c=this.ctx, o=c.createOscillator(), g=c.createGain(), t=c.currentTime+(at||0);
      o.type=type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
      g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.02);
    }catch(e){}
  },
  noise(dur,vol,freq){
    if(!this.on||!this.ctx) return;
    try{
      const c=this.ctx, n=Math.floor(c.sampleRate*dur), buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
      for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
      const s=c.createBufferSource(); s.buffer=buf;
      const fl=c.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=freq||4000;
      const g=c.createGain(); g.gain.value=vol;
      s.connect(fl); fl.connect(g); g.connect(c.destination); s.start();
    }catch(e){}
  },
  play(k,p){
    p=p||1;
    switch(k){
      case 'hit': this.noise(.12,.22*p,3500); this.tone(170,50,.14,'square',.1*p); break;
      case 'whoosh': this.noise(.22,.1,2500); this.tone(300,900,.18,'sine',.04); break;
      case 'boom': this.tone(95,28,.55,'sawtooth',.2); this.noise(.45,.22,1800); break;
      case 'zap': this.tone(1500,180,.22,'sawtooth',.08); this.noise(.2,.1,6000); break;
      case 'charge': this.tone(160,820,.45,'sine',.07); break;
      case 'ko': this.tone(240,36,.9,'sawtooth',.22); this.noise(.6,.28,1500); break;
      case 'thud': this.tone(70,30,.25,'sine',.25); this.noise(.2,.15,900); break;
      case 'poof': this.noise(.25,.14,1800); break;
      case 'heal': this.tone(520,1040,.3,'sine',.07); break;
      case 'cut': this.tone(900,150,.3,'square',.07); this.noise(.3,.12,5000); break;
      case 'fight': this.tone(220,440,.25,'square',.09); break;
      case 'chirp': for(let i=0;i<5;i++) this.tone(2600+i*140,3300,.05,'square',.04,i*.07); break;
      case 'tick': this.tone(1300,1000,.035,'square',.025); break;
      case 'reveal': { const n=[523,659,784,1047,1319]; for(let i=0;i<Math.min(5,p+1);i++) this.tone(n[i],n[i]*1.01,.24,'triangle',.07,i*.08); break; } // p = rarity 0..3
    }
  }
};

  /* a puppet is drawn like a fighter (drawFighter), hangs behind its master at p.off and follows them while

function drawCrow(ctx,x,y,s,dir,fl){
  ctx.save(); ctx.translate(x,y); ctx.scale(dir*s,s); ctx.fillStyle='#0b0a0f'; ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.lineWidth=1;
  const w=Math.sin(fl)*7;

  ctx.beginPath(); ctx.ellipse(0,0,8,3.6,-.1,0,TAU); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(8,-1.5,3,0,TAU); ctx.fill();

  ctx.restore();
}
/* Itachi's Mangekyo Sharingan: three curved blades on red */
function drawMangekyo(ctx,x,y,R,rot){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot);
  ctx.fillStyle='#c4101e'; ctx.beginPath(); ctx.arc(0,0,R,0,TAU); ctx.fill();

}

const LINES={
  skip:['{a} is still lost in the illusion.','{a} can only watch, stunned!','{a} shakes off the haze, a moment too late.'],
  heal:['{x} regenerates, +{h} HP.',"{x}'s wounds knit shut.",'{x} recovers {h} HP.'],

  ninPre:['{a} molds chakra... {move}!','{a} fires off {move}!','{a} flows through the seals: {move}!'],
  genPre:['{a} locks eyes with {d}...',"Genjutsu! {a} reaches into {d}'s mind!"],
  sigPre:['{a} is going for it all: {move}!','Signature move! {move}!','The arena holds its breath. {move}!','Here it comes! {move}!'],
  dodge:['{d} reads it and is gone!','Whiff! {d} was never there.','What an escape from {d}!','{d} swaps out at the last second!'],
  hitTai:['{dmg} damage! {a} connects.','{a} gets through for {dmg}.','Clean contact, {dmg} off {d}.','{d} eats a combo, {dmg}.'],
  hitNin:['{dmg} damage! {d} is caught in it.','{move} lands for {dmg} on {d}.','Direct hit, {dmg}!'],
  hitSig:['{dmg} DAMAGE! {d} is down to {hp} HP.','That one hurt. {d} is at {hp} HP.','Devastating! {d} drops to {hp} HP.'],
  crit:['CRITICAL HIT! {dmg}!','Found the weak spot: {dmg} critical!','A critical strike! {dmg} damage!'],
  trapped:['{d} is trapped in the illusion!',"{d} falls into {a}'s genjutsu!"],
  resisted:['{d} breaks the illusion!','{d} sees through it.'],
  guard:'{d} guards, halving the blow.',
  surv:'{d} REFUSES TO FALL! Still standing at 12 HP!',
  low:['{d} is hanging by a thread at {hp} HP.','{d} is under a quarter health!'],
  lead:['{x} takes the lead!','{x} turns it around!'],
  streak:'{a} is on a roll, {n} hits in a row!',
  ko:['AND THAT IS IT! {d} is down!','KNOCKOUT! {a} ends it!'],
  ultPre:['THE ULTIMATE GAUGE IS FULL! {a} goes all in: {move}!','This is it! {a} unleashes {move}!','Everything on the line! {move}!'],
  hitUlt:['ULTIMATE CONNECTS! {dmg} damage! {d} is at {hp} HP.','DEVASTATING! {dmg} off {d}, down to {hp} HP.','{d} takes the full force: {dmg} damage!'],
  ultReady:['{x} has a full ultimate gauge!','Careful. {x} can go for the ultimate!'],
  supPre:[`${KINU}! {a} breaks the seal on a forbidden technique: {move}!`,'This is everything {a} has, a forbidden art: {move}!',`The arena shakes. ${KINU}: {move}!`],
  hitSup:[`THE ${KINU} LANDS! {dmg} damage! {d} is at {hp} HP.`,'{d} takes the full {move}: {dmg} damage!'],
  supReady:[`{x} can unseal a ${KIN}!`,'{x} has the forbidden technique ready!'],
  guardUp:['{x} braces for impact.','{x} raises a guard.','{x} plays it safe and guards.'],
  gate:['{a} forces open the {g}!','{a} opens the {g}! The power keeps climbing!','Gate {n}, the {g}! {a} is glowing!'],
  gateDeath:['{a} OPENS THE GATE OF DEATH! There is no coming back from this!','The Eighth Gate! {a} is burning his own life force!'],
  drain:['The gates are burning {x} up: -{h} HP.','{x} pays for the open gates, -{h} HP.','Steam pours off {x}. -{h} HP.'],
  focus:['{x} steps back to gather chakra.','{x} focuses: +{h} chakra.','{x} takes a breath and refills, +{h} chakra.']
};
class Announcer{
  constructor(a,b,isMine){ this.d=[a,b]; this.isMine=isMine||(()=>false); this.hp=[100,100]; this.streak=[0,0]; this.lead=-1; this.lastIdx={}; this.ready=[false,false]; this.sready=[false,false]; }
  line(key){ const arr=LINES[key]; if(!Array.isArray(arr)) return arr; let i=Math.floor(Math.random()*arr.length); if(arr.length>1&&this.lastIdx[key]===i) i=(i+1)%arr.length; this.lastIdx[key]=i; return arr[i]; }
  fill(t,v){ return t.replace(/\{(\w+)\}/g,(m,k)=>v[k]!==undefined?v[k]:m); }
  vars(e){
    const a=e.att!==null?this.d[e.att]:null, d=e.att!==null?this.d[1-e.att]:null;
    return {a:a?a.short:'',d:d?d.short:'',move:(e.name||'').replace(/^an? /,''),dmg:e.dmg,hp:e.att!==null?e.hp[1-e.att]:0,x:e.who!==null?this.d[e.who].short:'',h:e.heal};
  }
  intro(label){ const [a,b]=this.d, mine=[a,b].filter(f=>this.isMine(f)); return `${label}: ${a.short} (${a.ovr}) vs ${b.short} (${b.ovr})${mine.length?`. ${mine[0].short} is on your squad.`:'.'}`; }
  matchup(){
    const [a,b]=this.d, diff=Math.abs(a.ovr-b.ovr), hi=a.ovr>=b.ovr?a:b, lo=hi===a?b:a;
    if(diff>=20) return `${lo.short} is a big underdog here, rated ${diff} points lower.`;
    if(diff<=4) return 'This one is too close to call.';
    return `${hi.short} is the favorite, but anything can happen.`;
  }
  preview(label){ return this.intro(label)+' '+this.matchup(); }
  pre(e){
    const v=this.vars(e);
    if(e.type==='heal') return this.fill(this.line('heal'),v);
    if(e.type==='focus') return this.fill(this.line('focus'),v);
    if(e.type==='guard') return this.fill(this.line('guardUp'),v);
    if(e.type==='drain') return this.fill(this.line('drain'),Object.assign(v,{h:e.dmg}));
    if(e.skip) return this.fill(this.line('skip'),v);
    if(e.gate) return this.fill(this.line(e.gate>=8?'gateDeath':'gate'),Object.assign(v,{g:GATES[e.gate].n,n:e.gate}));
    if(e.mv==='ult'){ this.ready[e.att]=false; this.sready[e.att]=false; return this.fill(this.line(e.sup?'supPre':'ultPre'),v); }
    const key=e.mv==='tai'?'taiPre':e.mv==='nin'?'ninPre':e.mv==='gen'?'genPre':'sigPre';
    return this.fill(this.line(key),v);
  }
  miss(e){ this.streak[e.att]=0; if(e.mv==='ult') this.ready[e.att]=false; return this.fill(this.line('dodge'),this.vars(e)); }
  hit(e){
    const v=this.vars(e); this.hp=e.hp.slice();
    let t;
    if(e.ko) t=this.fill(this.line('ko'),v);
    else if(e.surv) t=this.fill(LINES.surv,v);
    else if(e.mv==='gen') t=this.fill(this.line(e.stun?'trapped':'resisted'),v);
    else if(e.crit) t=this.fill(this.line('crit'),v);
    else if(e.mv==='ult') t=this.fill(this.line(e.sup?'hitSup':'hitUlt'),v);
    else t=this.fill(this.line(e.mv==='sig'?'hitSig':e.mv==='nin'?'hitNin':'hitTai'),v);
    if(e.guard) t+=' '+this.fill(LINES.guard,v);
    if(e.dmg>0){ this.streak[e.att]++; this.streak[1-e.att]=0; if(this.streak[e.att]===3||this.streak[e.att]===5) t+=' '+this.fill(LINES.streak,Object.assign({n:this.streak[e.att]},v)); }
    const lead=e.hp[0]>e.hp[1]?0:e.hp[1]>e.hp[0]?1:-1;
    if(!e.ko&&lead!==-1&&this.lead!==-1&&lead!==this.lead) t+=' '+this.fill(this.line('lead'),{x:this.d[lead].short});
    if(lead!==-1) this.lead=lead;
    if(e.um) for(let i=0;i<2;i++){
      if(e.uu&&e.uu[i]===2) continue;
      if(e.um[i]>=100&&!this.ready[i]&&e.mv!=='ult'){ this.ready[i]=true; t+=' '+this.fill(this.line('ultReady'),{x:this.d[i].short}); }
      if(e.sm&&e.sm[i]>=100&&!this.sready[i]&&e.mv!=='ult'){ this.sready[i]=true; t+=' '+this.fill(this.line('supReady'),{x:this.d[i].short}); }
    }
    if(!e.ko&&!e.surv&&e.hp[1-e.att]<=25) t+=' '+this.fill(this.line('low'),v);
    return t;
  }
  end(e){
    const w=this.d[e.win], l=this.d[1-e.win], wh=e.hp[e.win], lh=e.hp[1-e.win];
    let t=e.ko?`${w.short} wins by knockout!`:`Time! ${w.short} takes the decision, ${wh} HP to ${lh}.`;
    if(w.ovr+6<=l.ovr) t+=' What an upset!';
    if(this.st0){ const sw=this.st0[e.win], sl=this.st0[1-e.win], n=sw>0?sw+1:1; if(n>=3) t+=` That is ${n} straight tournament wins for ${w.short}.`; if(sl>=4) t+=` ${l.short}'s ${sl}-fight winning streak is over.`; }
    if(this.isMine(w)) t+=` ${w.short} advances for your squad.`; else if(this.isMine(l)) t+=` ${l.short} is out of your squad's run.`;
    return t;
  }
}

const STYLE_ADJ={nin:['Storm','Thunder','Blazing','Tempest'],tai:['Iron','Stone','Hurricane','Rampaging'],gen:['Phantom','Crimson','Silent','Midnight']};
const STYLE_NOUN=['Fangs','Blades','Foxes','Hawks','Serpents','Crows','Tigers','Wolves','Dragons','Lotus','Shadows','Hornets'];
const STYLE_NAME={nin:'Ninjutsu',tai:'Taijutsu',gen:'Genjutsu',spd:'Speed',sta:'Endurance',int:'Tactics'};
const STYLE_WIN={nin:'ends with a ninjutsu blow',tai:'ends with a taijutsu blow',gen:'traps the opponent in a genjutsu or ends with one'};
const AVG={}; ['nin','tai','gen','spd','sta','int'].forEach(k=>{ AVG[k]=ROSTER.reduce((s,f)=>s+f[k],0)/ROSTER.length; });
function squadIdent(ids){
  const fs=ids.map(byId).filter(Boolean), n=fs.length; if(!n) return null;
  const bases=new Set(fs.map(f=>f.base)), mean=k=>fs.reduce((s,f)=>s+f[k],0)/n;
  const best=(ks,vote)=>ks.slice().sort((a,b)=>(vote?vote(b)-vote(a):0)||mean(b)/AVG[b]-mean(a)/AVG[a])[0];
  // the fighting style is what most of the squad's signature moves are; stats break ties
  const prim=best(['nin','tai','gen'],k=>fs.filter(f=>f.sigType===k).length), sec=best(['spd','sta','int']);
  let name=null, sym=null, col=null, top=0;
  TEAMS.forEach(([t,bs,need,sy,c])=>{ const k=bs.filter(b=>bases.has(b)).length; if(k>=need&&k*2>=n&&k>top){ top=k; name=t; sym=sy; col=c; } });
  if(!name) for(const [t,test,sy,c,all] of FACTIONS){ const k=fs.filter(test).length; if(all?(k===n&&n>=3):k*2>n){ name=t; sym=sy; col=c; break; } }
  if(!name){
    let h=7; ids.slice().sort().join(',').split('').forEach(ch=>{ h=(h*31+ch.charCodeAt(0))>>>0; });
    name=`The ${STYLE_ADJ[prim][h%4]} ${STYLE_NOUN[(h>>>4)%STYLE_NOUN.length]}`;
    sym={tai:'gates',gen:'tomoe',nin:'swirl'}[prim]; col={tai:'#f2a33a',gen:'#a78bd8',nin:'#54b8e0'}[prim];
  }
  return {name,sym,col,prim,sec,style:`${STYLE_NAME[prim]} / ${STYLE_NAME[sec]}`,rating:Math.round(fs.reduce((s,f)=>s+f.ovr,0)/n*10)/10};
}
const squadName=()=>{ const I=squadIdent(state.squad); return (state.squadName||'').trim()||(I?I.name:''); };
// did this win match the squad's style? (scoring bonus)
function styleHit(prim,m,sim){
  const wi=sim.winner.id===m.a.id?0:1, mine=sim.log.filter(e=>e.att===wi&&e.mv&&!e.skip&&!e.dodge);
  const kind=e=>e.mv==='sig'||e.mv==='ult'?e.st:e.mv;
  const last=mine.slice().reverse().find(e=>e.dmg>0);
  if(prim==='gen') return mine.some(e=>e.stun&&kind(e)==='gen')||!!(last&&kind(last)==='gen');
  return !!(last&&kind(last)===prim);
}

function drawEmblem(g,sym,col,R){

    case 'swirl':

    case 'sand': // Hidden Sand: a pinched hourglass
      g.lineWidth=s*.15;

      g.beginPath(); g.moveTo(-s*.9,0); g.lineTo(-s*.42,0); g.moveTo(s*.42,0); g.lineTo(s*.9,0); g.stroke();
      break;
    case 'cloud': drawCloud(g,0,s*.1,s*2,0); break;
    case 'fire': drawFireKanji(g,0,s*.05,s*.95,ink); break;
    case 'uchiha': // the clan fan
      g.fillStyle='#d8323c'; g.beginPath(); g.arc(0,-s*.18,s*.66,Math.PI,0); g.closePath(); g.fill();
      g.fillStyle=ink; g.beginPath(); g.arc(0,-s*.18,s*.66,0,Math.PI); g.closePath(); g.fill();
      g.fillRect(-s*.1,s*.4,s*.2,s*.6);
      g.strokeStyle='rgba(0,0,0,.35)'; g.lineWidth=s*.05; g.beginPath(); g.arc(0,-s*.18,s*.66,0,TAU); g.stroke();
      break;
    case 'rinne':
      g.fillStyle='#b9a6e8'; g.beginPath(); g.arc(0,0,s*.95,0,TAU); g.fill();
      g.strokeStyle='#2a2240'; g.lineWidth=s*.07; [.24,.46,.68,.9].forEach(k=>{ g.beginPath(); g.arc(0,0,s*k,0,TAU); g.stroke(); });
      g.fillStyle='#2a2240'; g.beginPath(); g.arc(0,0,s*.1,0,TAU); g.fill();
      break;
    case 'tomoe': // sharingan
      g.fillStyle='#d8323c'; g.beginPath(); g.arc(0,0,s*.95,0,TAU); g.fill();
      g.strokeStyle='#15131c'; g.lineWidth=s*.06; g.beginPath(); g.arc(0,0,s*.58,0,TAU); g.stroke();
      g.fillStyle='#15131c'; g.beginPath(); g.arc(0,0,s*.2,0,TAU); g.fill();
      for(let i=0;i<3;i++){ const a=i*TAU/3-Math.PI/2, x=Math.cos(a)*s*.58, y=Math.sin(a)*s*.58; g.beginPath(); g.arc(x,y,s*.15,0,TAU); g.fill(); g.beginPath(); g.moveTo(x+Math.cos(a+1.6)*s*.15,y+Math.sin(a+1.6)*s*.15); g.quadraticCurveTo(x+Math.cos(a+1)*s*.4,y+Math.sin(a+1)*s*.4,x+Math.cos(a+2.2)*s*.36,y+Math.sin(a+2.2)*s*.36); g.lineTo(x+Math.cos(a-1.2)*s*.12,y+Math.sin(a-1.2)*s*.12); g.fill(); }

      g.strokeStyle='#8a1b24'; g.lineWidth=s*.08;
      g.beginPath(); g.moveTo(-s*.2,-s*.7); g.lineTo(s*.2,-s*.7); g.moveTo(0,-s*.82); g.lineTo(0,s*.75); g.moveTo(-s*.2,-s*.25); g.lineTo(s*.2,-s*.05); g.moveTo(s*.2,-s*.25); g.lineTo(-s*.2,-s*.05); g.moveTo(-s*.22,s*.35); g.lineTo(s*.22,s*.35); g.stroke();

    case 'hat': // kage hat
      g.beginPath(); g.moveTo(0,-s*.85); g.lineTo(s*.98,s*.42); g.quadraticCurveTo(0,s*.62,-s*.98,s*.42); g.closePath(); g.fill();
      g.fillStyle='#c8323c'; g.beginPath(); g.moveTo(-s*.5,s*-.2); g.lineTo(s*.5,s*-.2); g.lineTo(s*.62,s*.02); g.lineTo(-s*.62,s*.02); g.closePath(); g.fill();

}
function emblemURL(sym,col){
  const k=sym+col; if(_emCache[k]!==undefined) return _emCache[k];
  try{ const c=document.createElement('canvas'); c.width=c.height=128; const g=c.getContext('2d'); g.translate(64,64); drawEmblem(g,sym,col,62); _emCache[k]=c.toDataURL('image/png'); }
  catch(e){ _emCache[k]=''; }
  return _emCache[k];
}
const emblem=(I,cls)=>{ const u=emblemURL(I.sym,I.col); return u?`<img class="emb ${cls||''}" src="${u}" alt="">`:''; };

/* ---------- history: saved locally, fighter records and past tournaments ---------- */
const newRec=()=>({w:0,l:0,ko:0,u:0,up:0,t:0,fi:0,sf:0,e:0,b:0,st:0,bs:0});
const emptyHist=()=>({v:1,n:0,list:[],f:{},h2h:{},my:{p:0,t:0}});
let HIST=emptyHist();
try{ const h=JSON.parse(localStorage.getItem('fst_hist')||'null'); if(h&&h.v===1&&Array.isArray(h.list)&&h.f&&typeof h.f==='object') HIST=Object.assign(emptyHist(),h); }catch(e){}
function saveHist(){ try{ localStorage.setItem('fst_hist',JSON.stringify(HIST)); }catch(e){} }
function applyFight(R,m){
  const W=m.winner.id, Lo=m.result.loser.id, rw=R[W]||(R[W]=newRec()), rl=R[Lo]||(R[Lo]=newRec());
  rw.w++; rl.l++; if(m.result.ko) rw.ko++; if(m.result.ultW) rw.u++; if(m.result.ultL) rl.u++; if(m.upset) rw.up++;
  rw.st=rw.st>0?rw.st+1:1; rw.bs=Math.max(rw.bs,rw.st); rl.st=rl.st<0?rl.st-1:-1;
}
// a fighter's record including the tournament in progress (that is only saved when it ends)
function liveRec(id){
  const R={}; R[id]=Object.assign(newRec(),HIST.f[id]||{});
  if(!state.saved) doneFights().forEach(m=>{ if(m.winner.id===id||m.result.loser.id===id) applyFight(R,m); });
  return R[id];
}
const h2hKey=(a,b)=>a<b?a+'|'+b:b+'|'+a;
function h2h(a,b){ const v=HIST.h2h[h2hKey(a.base,b.base)]; if(!v) return null; return a.base<b.base?{a:v[0],b:v[1]}:{a:v[1],b:v[0]}; }
function finishOf(id){
  if(state.champion&&state.champion.id===id) return 1;
  for(let r=0;r<state.rounds.length;r++) for(const m of state.rounds[r]) if(m.result&&m.result.loser.id===id) return remain(r);
  return 0;
}
const finishName=n=>n===1?'Champion':n===2?'Final':n===4?'Semifinal':n===8?'Quarterfinal':n?`Round of ${n}`:'None';
function recordTournament(){
  if(state.saved) return;
  const fights=doneFights(), field=fieldOf(), last=nRounds()-1, fm=state.rounds[last][0];
  const ups=fights.filter(m=>m.upset).map(m=>({w:m.winner.id,l:m.result.loser.id,d:m.result.loser.ovr-m.winner.ovr})).sort((a,b)=>b.d-a.d);
  const kos={}, wins={}; fights.forEach(m=>{ wins[m.winner.id]=(wins[m.winner.id]||0)+1; if(m.result.ko) kos[m.winner.id]=(kos[m.winner.id]||0)+1; });
  const topKo=Object.keys(kos).sort((a,b)=>kos[b]-kos[a])[0];
  const runs=field.filter(f=>(wins[f.id]||0)>=2).sort((a,b)=>a.ovr-b.ovr);
  const prio={squad:0,upset:1,streak:2,war:3,ko:4,round:5,champ:9};
  const heads=state.story.filter(e=>e.k!=='champ'&&e.k!=='round').sort((a,b)=>prio[a.k]-prio[b.k]).slice(0,3).map(e=>[e.t,e.x]);
  const sum={n:HIST.n+1,at:Date.now(),N:state.N,mode:state.mode,era:state.era,champ:state.champion.id,runner:fm.result.loser.id,
    semis:state.N>=4?state.rounds[last-1].map(m=>m.result.loser.id):[],
    upset:ups[0]||null,ko:topKo?{id:topKo,n:kos[topKo]}:null,run:runs[0]?{id:runs[0].id,n:wins[runs[0].id]}:null,
    ults:fights.reduce((s,m)=>s+(m.result.ultW?1:0)+(m.result.ultL?1:0),0),ups:ups.length,
    spec:state.spectate,squad:state.squad.slice(),cap:state.captain,name:state.spectate?'':squadName(),score:state.spectate?0:total(),heads};
  fights.forEach(m=>{
    applyFight(HIST.f,m);
    const k=h2hKey(m.a.base,m.b.base), v=HIST.h2h[k]||(HIST.h2h[k]=[0,0]); v[k.split('|')[0]===m.winner.base?0:1]++;
  });
  field.forEach(f=>{ const R=HIST.f[f.id]||(HIST.f[f.id]=newRec()), fin=finishOf(f.id); R.e++; if(fin&&(!R.b||fin<R.b)) R.b=fin; if(fin===1) R.t++; if(fin&&fin<=2) R.fi++; if(fin&&fin<=4) R.sf++; });

  HIST.n++; HIST.list.unshift(sum); if(HIST.list.length>60) HIST.list.length=60;
  saveHist(); state.saved=true;
}

/* ---------- the tournament story ---------- */
function tell(k,t,x,r,mi){ state.story.push({k,t,x,r,mi:mi===undefined?null:mi}); }
function storyFight(m,r,mi,pre){
  const w=m.winner, l=m.result.loser, aW=w.id===m.a.id;
  const ups=doneFights().filter(x=>x.upset), wUp=ups.filter(x=>x.winner.id===w.id).length;
  const sw=pre[aW?0:1], sl=pre[aW?1:0], nw=sw>0?sw+1:1;
  if(m.upset){
    const d=l.ovr-w.ovr;
    if(ups.length===1) tell('upset','The first upset',`${w.short} (${w.ovr}) beats ${l.ovr}-rated ${l.short}.`,r,mi);
    else if(wUp>=2) tell('upset',wUp===2?'The run continues':'Giant killer',`${w.short} has now beaten ${wUp} higher-rated opponents.`,r,mi);
    else if(d>=20) tell('upset','Shock result',`${w.short} beats ${l.short}, who is rated ${d} points higher.`,r,mi);
  }
  if(l.id===state.favorite) tell('upset','The favorite falls',`${l.short}, the top-rated fighter in the bracket, is out in the ${roundName(r)}.`,r,mi);
  if(l.id===state.defending) tell('upset','The champion is dethroned',`${w.short} knocks out defending champion ${l.short}.`,r,mi);
  if(nw>=5&&nw%5===0) tell('streak','On fire',`${w.short} has won ${nw} tournament fights in a row.`,r,mi);
  if(sl>=5) tell('streak','Streak snapped',`${w.short} ends ${l.short}'s ${sl}-fight winning streak.`,r,mi);
  if(m.result.hpLeft>=100) tell('ko','Flawless',`${w.short} wins without losing a single HP.`,r,mi);
  const fin=m.result.log.find(e=>e.ko&&e.sup); if(fin) tell('ko',KIN,`${w.short} ends it with a forbidden technique, ${fin.name}.`,r,mi);
  if(inSquad(l.id)){
    const left=aliveSquad().length;
    if(!left) tell('squad','Your squad has fallen',`${l.short} was your last fighter standing.`,r,mi);
    else if(l.id===state.captain) tell('squad','Your captain falls',`${l.short} is out in the ${roundName(r)}. ${left} of your fighters ${left===1?'is':'are'} still in.`,r,mi);
  }
}
function warReport(r){
  const ak=state.mode==='akatsuki', test=ak?akaSide:isEdo;
  const start=fieldOf(), sa=start.filter(test).length; if(!sa||sa===start.length) return;
  const before=state.rounds[r].flatMap(m=>[m.a,m.b]), after=state.rounds[r+1]?state.rounds[r+1].flatMap(m=>[m.a,m.b]):[state.champion];
  const pa=before.filter(test).length, pb=before.length-pa, na=after.filter(test).length, nb=after.length-na;
  if(r===0&&after.length>1) tell('war','War report',ak?`After the first round: Akatsuki ${na}, Alliance ${nb}.`:`After the first round: ${na} reanimated, ${nb} living.`,r+1);
  if(pa&&!na) tell('war',ak?'The Akatsuki is wiped out':'The reanimated are sealed',ak?`No Akatsuki member got past the ${roundName(r)}.`:`Every Edo Tensei fighter is out after the ${roundName(r)}.`,r+1);
  if(pb&&!nb) tell('war',ak?'The Alliance is broken':'The living are gone',ak?'Only Akatsuki members are left.':'Only the reanimated are left.',r+1);
}
function storyRound(r){
  if(state.mode==='akatsuki'||state.mode==='edo') warReport(r);
  const nx=state.rounds[r+1]; if(!nx) return;
  const left=nx.flatMap(m=>[m.a,m.b]);
  if(left.length===4){
    const by=left.slice().sort((a,b)=>a.ovr-b.ovr), lo=by[0], hi=by[3];
    left.filter(f=>inSquad(f.id)).forEach(f=>tell('squad','Squad member, final four',`${f.short} is into the semifinals for your squad.`,r,state.rounds[r].findIndex(m=>m.winner.id===f.id)));
    tell('round','The final four',`${left.map(f=>f.short).join(', ')}.${hi.ovr-lo.ovr>=10?` ${lo.short} (${lo.ovr}) is the lowest-rated fighter left, two wins from the title.`:''}`,r+1);
  }
  if(left.length===2){
    const [a,b]=left, h=h2h(a,b); let x=`${a.short} against ${b.short} for the title.`;

function doSpin(i){
  if(state.spinning!==null||PROF.spins<=0||state.screen!=='draft') return;
  const keep=state.squad.filter((_,j)=>j!==i), used=new Set(keep.map(id=>byId(id).base));
  const pool=ROSTER.filter(f=>draftable(f)&&!used.has(f.base)); if(!pool.length) return;
  const tier=weighted(RORDER.filter(t=>pool.some(f=>f.tier===t)).map(t=>({t,w:RARITY[t].w}))).t;
  const res=pick(pool.filter(f=>f.tier===tier));
  PROF.spins--; saveProf(); Sfx.init();
  state.spinning=i; renderSpin(); renderStart();
  const finish=()=>{
    state.spinning=null;
    if(i<state.squad.length){ const old=state.squad[i]; state.squad[i]=res.id; if(state.captain===old) state.captain=res.id; }
    else state.squad.push(res.id);
    state.lastSpin={id:res.id};
    Sfx.play('reveal',RORDER.indexOf(res.tier));
    if(state.screen==='draft'){ draftChanged(); const h=document.querySelector('.hside .prof'); if(h) h.outerHTML=profChip(); }
  };
  if(reduced){ finish(); return; }
  // the reel: faces flick past, slowing down, then the result lands
  let k=0; const steps=16;
  const tick=()=>{
    const el=document.querySelector(`.sslot[data-i="${i}"]`);
    if(k>=steps||!el||state.screen!=='draft'){ finish(); return; }
    const f=pick(pool), last=k===steps-1;
    el.className=`sslot rolling r-${f.tier}`; el.style.setProperty('--rc',RARITY[f.tier].c);
    el.innerHTML=`${crest(f,'lg')}<div class="sn2">${f.short}</div>${rarTag(f)}<div class="sm2">Spinning...</div>`;
    Sfx.play('tick'); k++; setTimeout(tick,last?60:45+k*k*1.6);
  };
  tick();
}

/* ---------- tournament setup: one version per character ---------- */
function pickVersion(vs){
  const s=state.settings, M=tmode(), top=a=>a.slice().sort((x,y)=>y.ovr-x.ovr)[0];
  if(M.id==='chaos') return pick(vs);
  if(M.id==='edo'){ const e=vs.filter(isEdo); if(e.length) return s.versions==='strongest'?top(e):pick(e); }
  return s.versions==='strongest'?top(vs):pick(vs);
}
function buildField(){
  const s=state.settings, M=tmode(), N=state.N, byOvr=(a,b)=>b.ovr-a.ovr;
  const squadObjs=state.squad.map(byId), squadBases=new Set(squadObjs.map(f=>f.base));
  const chosen=[];
  BASES.forEach(base=>{
    if(squadBases.has(base)) return;
    const vs=ROSTER.filter(f=>f.base===base&&eligible(f,state.mode,state.era));
    if(vs.length) chosen.push(pickVersion(vs));
  });
  const take=(arr,n)=>{ if(n<=0) return []; if(n>=arr.length) return arr.slice(); return s.field==='strong'&&M.id!=='chaos'?arr.slice().sort(byOvr).slice(0,n):shuffle(arr).slice(0,n); };
  if(M.id==='akatsuki'){
    // two halves, and every first-round fight is Akatsuki against the Alliance
    const half=N/2, aka=akaSide;
    const A=squadObjs.filter(aka).concat(take(chosen.filter(aka),half-squadObjs.filter(aka).length));
    const L=squadObjs.filter(f=>!aka(f)).concat(take(chosen.filter(f=>!aka(f)),half-squadObjs.filter(f=>!aka(f)).length));
    let pairs;
    if(s.seed==='rating'){ const As=A.slice().sort(byOvr), Ls=L.slice().sort(byOvr), ps=As.map((f,i)=>[f,Ls[half-1-i]]); pairs=seedOrder(half).map(n=>ps[n-1]); }
    else { const As=shuffle(A), Ls=shuffle(L); pairs=As.map((f,i)=>[f,Ls[i]]); }
    return pairs.flatMap(p=>Math.random()<.5?p:[p[1],p[0]]);
  }
  const need=N-squadObjs.length;
  let others;
  if(M.id==='edo'){ const e=take(chosen.filter(isEdo),need); others=e.concat(take(chosen.filter(f=>!isEdo(f)),need-e.length)); }
  else others=take(chosen,need);
  let list=squadObjs.concat(others);
  if(s.seed==='rating'&&M.id!=='chaos'){ const sorted=list.slice().sort(byOvr); list=seedOrder(list.length).map(n=>sorted[n-1]); }
  else list=shuffle(list);
  return list;
}
function startTournament(spec){
  if(spec!==undefined){
    if(spec&&!state.spectate) state.keep={squad:state.squad.slice(),captain:state.captain};

  }
  if(state.spectate){ state.squad=[]; state.captain=null; }
  const s=state.settings;
  state.mode=s.mode; state.era=s.era; state.N=s.size; state.draftType=state.spectate?'none':s.draft; state.reward=null;
  if(state.mode==='chaos'){
    // your characters stay, their versions are rolled
    const re={}; state.squad=state.squad.map(id=>{ const n=pick(ROSTER.filter(f=>f.base===byId(id).base)).id; re[id]=n; return n; });
    if(state.captain) state.captain=re[state.captain]||state.captain;
  }
  state.run++; state.r=0; state.m=0; state.tab=0; state.champion=null; state.busy=false; state.copied=false; state.paused=false; state.toFinal=false; state.saved=false;

  state.squad.forEach(id=>state.pts[id]=0);
  const field=fieldOf();
  state.favorite=field.slice().sort((a,b)=>b.ovr-a.ovr)[0].id;
  const last=HIST.list.find(t=>t.mode===state.mode&&(t.mode!=='canon'||t.era===state.era));
  state.defending=last&&field.some(f=>f.id===last.champ)?last.champ:null;
  if(state.defending) tell('round','The champion returns',`${shortOf(state.defending)} won the last ${modeLabel(state.mode,state.era)} tournament and is back to defend the title.`,0);
  if(state.mode==='akatsuki') tell('war','The war begins',`${state.N/2} Akatsuki members against ${state.N/2} fighters of the Allied Forces.`,0);
  if(state.mode==='edo'){ const e=field.filter(isEdo).length; if(e) tell('war','The dead walk',`${e} reanimated fighter${e>1?'s':''} in a ${state.N}-fighter bracket.`,0); }

  if(state.spectate) spectateLoop();
}

function buildArena(a,b,label,intro,note,theme){

function setHp(hp,ch,um,sm,uu,gt){

    const bar=$('hpbar'+s), n=$('hpn'+s); if(!bar) return;
    const v=hp[i]; bar.setAttribute('aria-valuenow',v);
    const b=bar.firstElementChild; b.style.width=v+'%';
    b.style.background=v>50?'var(--good)':v>25?'var(--flame)':'var(--ko)';
    n.textContent=v+' HP';

      const ub=$('ub'+s), ul=$('ul'+s), ubar=$('ubar'+s), spent=uu&&uu[i]===2, u=spent?0:um[i], sp=spent||!sm?0:sm[i];

}

async function playSim(m,sim,r,real){

/* ---------- applying results ---------- */
function finalize(m,sim){
  const r=state.r, mi=state.m, pre=[liveRec(m.a.id).st,liveRec(m.b.id).st];
  m.result=sim; m.winner=sim.winner;
  m.upset=sim.winner.ovr+6<=sim.loser.ovr;
  state.out[sim.loser.id]=roundName(r);
  delete state.out[sim.winner.id];
  if(inSquad(sim.winner.id)){
    let p=PTS_BY_REMAIN[remain(r)]||4;
    if(sim.ko) p+=5;
    if(sim.hpLeft>=80) p+=5;
    if(m.upset) p+=8;
    if(sim.supW) p+=15; else if(sim.ultW) p+=10;
    if(r===nRounds()-1) p+=25;
    const I=squadIdent(state.squad);
    if(I&&styleHit(I.prim,m,sim)){ p+=4; m.styleB=true; }
    if(sim.winner.id===state.captain){ p=Math.ceil(p*1.5); m.capB=true; }
    m.award=p;
    state.pts[sim.winner.id]=(state.pts[sim.winner.id]||0)+p;
  }
  storyFight(m,r,mi,pre);
  state.m++;
  if(state.m>=state.rounds[r].length){
    if(r===nRounds()-1){
      state.champion=sim.winner;
      storyRound(r); storyChampion();
      if(!state.spectate){ const t=total(), k=bestKey(); if(t>(state.best[k]||0)){ state.best[k]=t; try{ localStorage.setItem('fst_best2',JSON.stringify(state.best)); }catch(e){} } }
      recordTournament(); grantXP();
    } else {
      state.rounds.push(makeRound(state.rounds[r].map(x=>x.winner)));
      storyRound(r);
      state.r++; state.m=0; if(state.tab!=='story') state.tab=state.r;
    }
  }
}
function simSilent(stop){
  let guard=0, lastM=null, lastR=0;
  while(!state.champion&&!stop()&&guard++<400){ const m=curMatch(); lastM=m; lastR=state.r; finalize(m,simFight(m.a,m.b)); }
  return {m:lastM,r:lastR};
}
function simRound(){ if(state.busy||state.champion) return; const r0=state.r; afterSim(simSilent(()=>state.r!==r0)); }
function simAll(){ if(state.busy) return; afterSim(simSilent(()=>false)); }
function simSquad(){ if(state.busy||state.champion) return; afterSim(simSilent(()=>hasSquad(curMatch()))); }

function renderDuel(){

// resolves with the chosen move (or undefined for the AI, or null if the fight was abandoned)
function askMove(){
  const S=state.duel;
  if(S.auto) return Promise.resolve(undefined);
  return new Promise(res=>{ S.waiting=true; S.choose=k=>{ S.waiting=false; S.choose=null; res(k); }; renderDuel(); setTicker(`Your move: pick a technique for ${S.D.f[S.me].d.short}.`,false); });
}
function chooseMove(k){
  const S=state.duel; if(!S||!S.waiting||!S.choose) return;

// play one fight with the player controlling side `me` (0 = a, 1 = b). Returns the simFight-style result, or null if abandoned.
async function playControlled(a,b,me,o){
  const run=state.run, D=makeDuel(a,b);
  state.busy=true; state.paused=false;
  state.duel={D,me,waiting:false,choose:null,auto:false,done:false};
  const st=buildArena(a,b,o.label,o.notes||[],`You control ${[a,b][me].short}`,o.theme);
  const ar=$('arena'); if(ar){ ar.classList.add('duel'); ar.scrollIntoView({block:'start',behavior:reduced?'auto':'smooth'}); }
  setHp([100,100],[100,100],[0,0]); renderDuel(); renderTop();
  const ann=new Announcer(a,b,f=>f===[a,b][me]);
  st.onSay=(k,e)=>{ if(k==='pre') setTicker(ann.pre(e),false); else if(k==='hit') setTicker(ann.hit(e),true); else if(k==='miss') setTicker(ann.miss(e),false); else setTicker(ann.end(e),true); };
  const gone=()=>state.run!==run||state.stage!==st||!state.duel||state.duel.D!==D;
  let ptr=0;
  const playNew=async()=>{
    while(ptr<D.log.length){
      const e=D.log[ptr++]; if(gone()) return false;
      addLine(e); if(e.type==='info') continue;
      try{ await Promise.race([e.type==='end'?st.finale(e):st.playEntry(e),stageGuard(st,12000)]); }catch(err){ console.error(err); }
      setHp(e.hp,e.ch,e.um,e.sm,e.uu,e.gt); if(e.type==='end') markWinner(e.win);
    }
    return !gone();
  };
  D.say(`${a.short} and ${b.short} step into the arena. You control ${[a,b][me].short}.`,'info');
  setTicker(ann.intro(o.round),false);
  try{ await st.intro(o.round); }catch(err){ console.error(err); }
  if(!await playNew()) return null;
  while(!D.over()){
    D.turn++;
    st.skipping=false;
    let choice;
    if(D.f[me].stun>0){ renderDuel(); }
    else { choice=await askMove(); if(choice===null||gone()) return null; }
    renderDuel();
    const ord=choice==='guard'?[me,1-me]:D.order(); // a guard goes up before anyone moves
    for(const i of ord){ if(D.f[0].hp<=0||D.f[1].hp<=0) break; D.act(i,i===me?choice:undefined); if(!await playNew()) return null; }
    D.endTurn(); if(!await playNew()) return null;
  }
  const res=D.result(); st.skipping=false;
  if(!await playNew()) return null;
  state.duel.done=true; renderDuel();
  return res;
}

/* ---------- spectator mode: the tournament runs itself ---------- */
// is this fight worth putting on camera? (the sim is pure, so we know the outcome before showing it)
function worthWatching(m,sim,r){
  if(r>=nRounds()-3) return true;
  let s=0;
  if(sim.winner.ovr+6<=sim.loser.ovr) s+=3;
  if(sim.supW||sim.supL) s+=4; else if(sim.ultW||sim.ultL) s+=2;
  if(sim.hpLeft<=25) s+=2; else if(sim.hpLeft<=45) s+=1;
  if(Math.abs(m.a.ovr-m.b.ovr)<=4) s+=1;
  if([m.a,m.b].some(f=>f.id===state.defending||f.id===state.favorite||liveRec(f.id).st>=4)) s+=2;
  if(s>=4) return true;
  const rd=state.rounds[r];
  return state.m===rd.length-1&&!rd.some(x=>x.watched);
}
async function specWait(ms,run){ let left=ms*(state.speed==='fast'?.55:1); while(left>0&&state.run===run&&state.spectate){ await sleep(100); if(!state.paused) left-=100; } }
function offCamera(batch){
  const ws=batch.map(m=>m.winner.short), n=batch.length;
  setTicker(`Off camera: ${n} fight${n>1?'s':''} decided. ${ws.slice(0,3).join(', ')}${n>3?` and ${n-3} more`:''} ${n>1?'advance':'advances'}.`,false);
  const log=$('log'); if(log){ batch.forEach(m=>{ const li=document.createElement('li'); li.className='info'; li.textContent=`${m.winner.short} beat ${m.result.loser.short}${m.result.ko?' by KO':''}, ${m.result.hpLeft} HP left${m.upset?', an upset':''}.`; log.appendChild(li); }); log.scrollTop=log.scrollHeight; }
}
async function spectateLoop(){
  const run=state.run, live=()=>state.run===run&&state.spectate&&state.screen==='tournament';
  let batch=[];
  await specWait(1200,run);
  while(live()&&!state.champion){
    if(state.paused){ await sleep(120); continue; }
    const m=curMatch(), r=state.r, sim=simFight(m.a,m.b), quick=state.toFinal&&r<nRounds()-1;
    if(quick||!(state.specAll||worthWatching(m,sim,r))){
      finalize(m,sim); batch.push(m);
      if(batch.length%8===0) await sleep(0);
      continue;
    }
    if(state.toFinal){ state.toFinal=false; }
    if(batch.length){ refreshAll(); offCamera(batch); batch=[]; await specWait(2600,run); if(!live()) return; }
    Sfx.init();
    const ok=await playSim(m,sim,r,true); if(!ok||!live()) return;
    const n0=state.story.length;
    finalize(m,sim); state.busy=false; refreshAll(); announceStory(n0);
    if(state.champion) break;
    await specWait(state.story.length>n0?3400:2400,run);
  }
}

    rows.push(['Your squad',T.spec?'Spectated':`${esc(T.name||'Squad')}: ${T.score} pts${T.squad.includes(T.champ)?', champions':''}`]);
    return `<article class="hcard">
      <div class="hh"><span>#${T.n} · ${modeLabel(T.mode,T.era)} · ${T.N} fighters</span><span>${when}</span></div>
      <div class="hc">${crestId(T.champ)}<div><div class="hk">Champion</div><div class="hn">${shortOf(T.champ)}</div></div></div>
      <dl>${rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
      ${T.heads&&T.heads.length?`<ul class="hstory">${T.heads.map(([t,x])=>`<li><b>${esc(t)}</b> ${esc(x)}</li>`).join('')}</ul>`:''}
    </article>`;
  }).join('')}</div>`;
}
function histTable(champs){
  let recs=groupRecs().filter(g=>champs?g.R.fi>0:(g.R.w+g.R.l)>0);
  if(!recs.length) return `<p class="lede">${champs?'No finals played yet.':'No fights recorded yet.'}</p>`;
  const k=state.hsort, wr=g=>(g.R.w+g.R.l)?g.R.w/(g.R.w+g.R.l):0;
  const key={t:g=>g.R.t*1e6+g.R.fi*1e3+g.R.w,w:g=>g.R.w*1e3+wr(g),wr:g=>(g.R.w+g.R.l>=3?1e3:0)+wr(g),u:g=>(g.R.w+g.R.l)?g.R.u/(g.R.w+g.R.l):0,up:g=>g.R.up,bs:g=>g.R.bs}[champs?'t':k]||(g=>g.R.w);
  recs.sort((a,b)=>key(b)-key(a)||a.name.localeCompare(b.name));
  const name=g=>`<td><span class="fn">${crest(g.f,'sm')}<span>${g.name}</span></span></td>`;
  if(champs) return `<div class="tscroll"><table class="htab"><thead><tr><th>${state.hgroup==='version'?'Fighter':'Character'}</th><th>Titles</th><th>Finals</th><th>Final four</th><th>Wins</th><th>Record</th></tr></thead><tbody>
    ${recs.map(g=>`<tr>${name(g)}<td><b>${g.R.t}</b></td><td>${g.R.fi}</td><td>${g.R.sf}</td><td>${g.R.w}</td><td>${g.R.w}-${g.R.l}</td></tr>`).join('')}</tbody></table></div>`;
  return `<div class="hrow"><label class="sl" for="hsort">Sort by</label><select id="hsort" aria-label="Sort records">
      ${[['t','Titles'],['w','Wins'],['wr','Win rate'],['u','Ultimate rate'],['up','Upsets'],['bs','Best streak']].map(([v,t])=>`<option value="${v}" ${k===v?'selected':''}>${t}</option>`).join('')}</select></div>
    <div class="tscroll"><table class="htab"><thead><tr><th>${state.hgroup==='version'?'Fighter':'Character'}</th><th>Record</th><th>Win rate</th><th>Titles</th><th>Ultimate rate</th><th>Upsets</th><th>Best finish</th><th>Best streak</th>${state.hgroup==='version'?'<th>Now</th>':''}</tr></thead><tbody>
    ${recs.map(g=>`<tr>${name(g)}<td>${g.R.w}-${g.R.l}</td><td>${pct(g.R.w,g.R.w+g.R.l)}</td><td>${g.R.t}</td><td>${pct(g.R.u,g.R.w+g.R.l)}</td><td>${g.R.up}</td><td>${finishName(g.R.b)}</td><td>${g.R.bs}</td>${state.hgroup==='version'?`<td>${g.R.st>0?`Won ${g.R.st}`:g.R.st<0?`Lost ${-g.R.st}`:'-'}</td>`:''}</tr>`).join('')}</tbody></table></div>
    <p class="sh">Ultimate rate: share of fights in which the fighter landed an Ultimate. Every fight so far has ended in a knockout, so there is no separate KO rate.</p>`;
}
function renderHistory(){
  destroyStage();
  if(state.screen!=='history') state.prev=state.screen;
  state.screen='history';
  const v=state.hview, opt=(key,val,t)=>`<button role="radio" aria-checked="${String(state[key]===val)}" data-action="${key}" data-val="${val}">${t}</button>`;
  app.innerHTML=`
    <div class="hdr">
      <div><div class="kicker">The chronicle</div><h1 class="title small">Tournament<br><em>History</em></h1><p class="lede">Every finished tournament is saved in this browser: champions, upsets, and the record of every fighter who has stepped into the bracket.</p></div>
      <div class="hside">${profChip()}<div class="row hbtn"><button class="btn small" data-action="back">${state.prev==='tournament'?'Back to the tournament':'Back to the draft'}</button><button class="btn small" data-action="theme">Light / dark</button></div></div>
    </div>
    <div class="score">${histStats()}</div>
    <div class="row hseg">
      <div class="seg" role="radiogroup" aria-label="History view">${opt('hview','recent','Tournaments')}${opt('hview','champs','Champions')}${opt('hview','records','Records')}</div>
      ${v==='recent'?'':`<div class="seg" role="radiogroup" aria-label="Group by">${opt('hgroup','version','Versions')}${opt('hgroup','character','Characters')}</div>`}
    </div>
    <div id="hbody">${v==='recent'?histRecent():histTable(v==='champs')}</div>
    <div class="hclear">${HIST.n?(state.confirmClear?`<span>Delete all ${HIST.n} tournaments and every record?</span><button class="btn small" data-action="clearyes">Delete history</button><button class="btn small" data-action="clearno">Keep it</button>`:'<button class="btn small" data-action="clearhist">Clear history</button>'):''}</div>
    ${credit()}`;
}

/* ---------- events ---------- */
app.addEventListener('click',e=>{
  const t=e.target.closest('[data-action]'); if(!t||t.disabled) return;
  const a=t.dataset.action, v=t.dataset.val;
  if(a==='theme') toggleTheme();
  else if(a==='toggle'){
    const id=t.dataset.id;
    if(state.spinning!==null||(state.settings.draft==='spin'&&!inSquad(id))) return;
    if(inSquad(id)) state.squad=state.squad.filter(x=>x!==id);
    else if(state.squad.length<state.settings.squadSize&&!lockedBy(byId(id))) state.squad.push(id);
    draftChanged();
  }
  else if(a==='random'){
    const bases=new Set(), picks=[];
    for(const f of shuffle(ROSTER.filter(x=>draftable(x)))){ if(picks.length>=state.settings.squadSize) break; if(!bases.has(f.base)){ bases.add(f.base); picks.push(f.id); } }
    state.squad=picks; state.captain=null; draftChanged();
  }
  else if(a==='clear'){ if(state.spinning===null){ state.squad=[]; draftChanged(); } }
  else if(a==='filter'){ state.filter=v; renderChips(); renderGrid(); }
  else if(a==='spin') doSpin(+t.dataset.i);
  else if(a==='mode'||a==='set'){
    const s=state.settings, k=a==='mode'?'mode':t.dataset.key;
    if(state.spinning!==null) return;
    if(k==='draft'&&v==='spin'&&s.draft!=='spin'){ state.squad=[]; state.captain=null; state.lastSpin=null; } // a spun squad has to be spun
    s[k]=(k==='size'||k==='squadSize')?+v:v;
    if(k==='size'){ const ok=[3,5,8].filter(x=>x<=s.size/2); if(!ok.includes(s.squadSize)) s.squadSize=ok[ok.length-1]; }
    fitSettings();
    renderModes(); renderSettings(); draftChanged();
  }
  else if(a==='start'){ if(state.squad.length===state.settings.squadSize&&state.spinning===null){ Sfx.init(); startTournament(false); } }
  else if(a==='spectate'){ if(state.spinning===null){ Sfx.init(); startTournament(true); } }
  else if(a==='watch') watchNext();
  else if(a==='playme') fightYourself();
  else if(a==='move') chooseMove(v);
  else if(a==='autofight'){ const S=state.duel; if(S){ S.auto=!S.auto; if(S.auto&&S.waiting) chooseMove(undefined); renderDuel(); } }
  else if(a==='quick'){ if(state.spinning===null){ Sfx.init(); startVersus(); } }
  else if(a==='vsfight') vsFight();
  else if(a==='vsrand'){ if(!state.busy){ const other=v==='me'?state.vs.foe:state.vs.me; state.vs[v]=pick(ROSTER.filter(f=>f.base!==byId(other).base)).id; state.vs.last=null; renderVersus(); } }
  else if(a==='simround') simRound();
  else if(a==='simall') simAll();
  else if(a==='simsquad') simSquad();
  else if(a==='skip'){ if(state.stage) state.stage.skip(); }
  else if(a==='pause'){ state.paused=!state.paused; if(state.stage) state.stage.paused=state.paused; renderControls(); }
  else if(a==='specall'){ state.specAll=v==='1'; renderControls(); }
  else if(a==='tofinal'){ state.toFinal=true; if(state.stage&&state.busy) state.stage.skip(); renderControls(); }
  else if(a==='speed'){ state.speed=v; if(state.stage) state.stage.mul=v==='fast'?.55:1; renderControls(); }
  else if(a==='sound'){ Sfx.on=!Sfx.on; Sfx.init(); try{ localStorage.setItem('fst_sound',Sfx.on?'on':'off'); }catch(err){} renderControls(); }
  else if(a==='tab'){ state.tab=v==='story'?'story':+v; renderTabs(); renderMatches(); if(v==='story'&&t.classList.contains('headline')){ const tb=$('tabs'); if(tb) tb.scrollIntoView({block:'start',behavior:reduced?'auto':'smooth'}); } }
  else if(a==='view') viewMatch(+t.dataset.r,+t.dataset.m);
  else if(a==='copy') copyRecap();
  else if(a==='again'){ Sfx.init(); startTournament(); }
  else if(a==='history'){ if(!state.busy){ state.confirmClear=false; renderHistory(); window.scrollTo(0,0); } }
  else if(a==='back'){ if(state.screen==='versus'){ abandonDuel(); state.run++; state.busy=false; state.paused=false; renderDraft(); } else if(state.prev==='tournament'&&state.rounds.length) renderTournament(); else renderDraft(); window.scrollTo(0,0); }
  else if(a==='hview'||a==='hgroup'){ state[a]=v; renderHistory(); }
  else if(a==='clearhist'){ state.confirmClear=true; renderHistory(); }
  else if(a==='clearno'){ state.confirmClear=false; renderHistory(); }
  else if(a==='clearyes'){ HIST=emptyHist(); saveHist(); state.confirmClear=false; renderHistory(); }
  else if(a==='newdraft'){
    abandonDuel(); state.run++; state.busy=false; state.paused=false; state.toFinal=false;
    if(state.spectate){ const k=state.keep||{squad:[],captain:null}; state.squad=k.squad; state.captain=k.captain; state.keep=null; state.spectate=false; }
    else { state.squad=[]; state.captain=null; state.squadName=''; }
    renderDraft();
  }
});
app.addEventListener('input',e=>{
  if(e.target.id==='q'){ state.q=e.target.value; renderGrid(); }
  else if(e.target.id==='sqname'){ const I=squadIdent(state.squad); state.squadName=I&&e.target.value.trim()===I.name?'':e.target.value; }
});
app.addEventListener('change',e=>{
  if(e.target.id==='vsme'||e.target.id==='vsfoe'){
    if(state.busy){ e.target.value=state.vs[e.target.id==='vsme'?'me':'foe']; return; }
    const k=e.target.id==='vsme'?'me':'foe', other=state.vs[k==='me'?'foe':'me'];
    state.vs[k]=e.target.value; state.vs.last=null;
    if(byId(state.vs[k]).base===byId(other).base) state.vs[k==='me'?'foe':'me']=pick(ROSTER.filter(f=>f.base!==byId(e.target.value).base)).id;
    renderVersus(); return;
  }
  if(e.target.id==='sort'){ state.sort=e.target.value; renderGrid(); }
  else if(e.target.id==='cap'){ state.captain=e.target.value; renderTray(); renderIdent(); }
  else if(e.target.id==='hsort'){ state.hsort=e.target.value; renderHistory(); }
  else if(e.target.id==='sqname'){ if(!e.target.value.trim()){ state.squadName=''; renderIdent(); } }
});

renderDraft();
</script>
</body>
